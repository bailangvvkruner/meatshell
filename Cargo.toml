[package]
name = "meatshell"
version = "0.6.4"
edition = "2021"
authors = ["meatshell contributors"]
description = "A lightweight FinalShell-style SSH/terminal client written in Rust + Slint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your/meatshell"
readme = "README.md"
rust-version = "1.92"

[features]
default = []
# Normal Windows debug builds use the GUI subsystem just like releases. Enable
# this explicitly when a developer needs live tracing on stderr.
dev-console = []

[dependencies]
slint = { version = "1.17.1", features = ["compat-1-2"] }
# ICU4X (pulled in by Slint's text layout) spams stderr with raw `eprintln!`
# ("ICU4X data error: No segmentation model for language: ja") because its
# `log` shim falls back to eprintln when the `logging` feature is off. Turning
# `logging` on routes those through the real `log` crate → our tracing
# subscriber, where init_tracing silences the `icu_provider` target.
icu_provider = { version = "2", features = ["logging"] }
# Direct access to the winit window/events (OS file-drop for drag-and-drop upload).
i-slint-backend-winit = "1.17.1"
# Raw HWND access (matches winit's rwh 0.6) for the Win11 rounded-corner + shadow
# DWM tweaks on the frameless window (#162 / #166). Only used under cfg(windows).
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
# Local, authenticated Debug API used by opt-in AI/tool integrations. The
# server binds loopback only; no CORS or public-network listener is exposed.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
# 0.62 fixes the remotely reachable CryptoVec growth paths reported in
# RUSTSEC-2026-0153/0154. Keep the SSH and key-format crates exact so a crypto
# dependency transition cannot enter a release through an unrelated lock update.
russh = { version = "=0.62.2", default-features = false, features = ["des", "flate2", "ring", "rsa"] }
ssh-key = "=0.7.0-rc.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
futures = "0.3"
vt100 = "0.16.2"
portable-pty = "0.9.0"
# East Asian width detection for terminal copy/find column math. Pinned to the
# same version vt100 uses so "is this glyph 2 cells wide?" agrees with how vt100
# lays CJK glyphs on the grid — otherwise selection/find columns drift (#132).
unicode-width = "0.2.2"
# Split terminal output into complete emoji grapheme clusters (ZWJ sequences,
# flags, skin tones, variation selectors) before replacing them with images.
unicode-segmentation = "1.12"
# Slint's software/femtovg text rasterizers flatten color-font glyphs to a
# monochrome mask. Embedded 72px Twemoji PNGs keep emoji colored on every
# renderer without switching the whole Windows application to Skia (#269).
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
russh-sftp = "2"
rfd = "0.15"
arboard = "3"
# Zeroes password buffers on drop so plaintext credentials don't linger in
# freed heap memory (core dumps / debuggers / /proc/pid/mem).
zeroize = "1"
# SOCKS5 proxy tunnelling for SSH/SFTP in network-restricted environments.
# (HTTP CONNECT proxies are handled in src/proxy.rs without an extra crate.)
tokio-socks = "0.5"
base64 = "0.22"
# Native PuTTY PPK v2/v3 private-key loading (#281). Conversion stays entirely
# in memory: AES-CBC decrypts encrypted key blobs, Argon2 handles PPKv3 key
# derivation, and HMAC verifies the file before it reaches the SSH parser.
aes = "0.8"
argon2 = "0.5"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# Enumerate installed system fonts for the Interface (font) settings picker.
fontdb = "0.23.0"
# Terminal row rasterization. Keeping shaping and glyph fallback in a dedicated
# worker removes hundreds of Slint Text nodes from the hot UI path.
cosmic-text = { version = "0.19.0", features = ["shape-run-cache"] }
# Cross-platform serial port access for the Serial session type (#14, #17).
# Opens COM3 / /dev/ttyUSB0 etc.; on Linux the default `libudev` feature is
# used for port enumeration (CI installs libudev-dev).
serialport = "4"
# ChaCha20-Poly1305 AEAD for encrypting passwords at rest in sessions.json.
# rand (OsRng) and base64 are already pulled in by other deps above.
chacha20poly1305 = "0.10"
# Detect whether the OS is running in dark or light mode.
# Used on startup to honour the system preference before the user overrides it.
dark-light = "1"
# Lightweight synchronous HTTPS client (bundled rustls, no OpenSSL) for the
# in-app update check against the GitHub releases API (#48). Runs on a
# background thread so it never blocks startup; failure is silently ignored.
ureq = { version = "2", features = ["tls"] }

# Image decoding: custom wallpapers (PNG/JPEG/WebP/BMP) for the immersive theme,
# and the embedded PNG window icon on Linux. On Windows the icon comes from the
# .ico embedded by winresource at link time; on macOS from the app bundle.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Native Wayland clipboard (wlr-data-control protocol) so copy/paste works on
# Wayland sessions (KDE/wlroots) without relying on XWayland (issue #47).
# Feature is additive over the base `arboard = "3"` dependency above.
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
# Query ANGLE's D3D11 device for IDXGIDevice3::Trim when the terminal has been
# idle. This releases driver scratch buffers without changing the Slint scene,
# themes, wallpaper, or rendering state.
windows = { version = "0.62.2", default-features = false, features = ["Win32_Graphics_Dxgi"] }

# Also compile the Skia renderer on macOS (the feature is additive over the base
# Slint dependency) so users can opt into it with SLINT_BACKEND=winit-skia.
# Windows uses the lighter FemtoVG/ANGLE path; Linux keeps its default backend.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.17.1", features = ["renderer-skia"] }

[build-dependencies]
slint-build = "1.17.1"

# Embeds assets/meatshell.ico into the .exe so Explorer / taskbar / shortcuts
# show the app icon. Windows-only; ignored on other targets.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Slint currently asks glutin-winit to prefer native WGL. This tiny vendored
# patch tries the bundled ANGLE EGL/D3D11 runtime first and still falls back to
# WGL when the DLLs are absent or cannot initialize.
glutin-winit = { path = "vendor/glutin-winit" }
# OpenGL snapshots must redraw the requested window before readback; otherwise
# the last ComboBox/menu popup surface leaks into the Debug API screenshot.
i-slint-renderer-femtovg = { path = "vendor/i-slint-renderer-femtovg" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
