name: Sync check

# Compile + test gate for the upstream-sync branch. Upstream only ever builds
# on release tags, so without this a plain branch push would land unverified
# code. It also gives a fork a place to prove the replay builds before the
# branch is proposed upstream.
on:
  push:
    branches: ["sync/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
      # Build-time only — no GPU/display required to compile or test.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --all-targets also compiles the integration tests and benches, so a
      # renamed public item fails here rather than in the test step.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked
