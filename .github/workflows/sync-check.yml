name: Sync check

# Compile + test gate for the upstream-sync branch. Upstream only ever builds
# on release tags, so without this a plain branch push would land unverified
# code. It also gives a fork a place to prove the replay builds before the
# branch is proposed upstream.
#
# Windows only: this fork ships the Windows build, and the unix-only tests that
# upstream never runs on Linux/macOS assume dev-machine paths and permissions
# (noisy, not actionable here). Add os entries back to the matrix if that
# changes.
on:
  push:
    branches: ["sync/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --all-targets also compiles the integration tests and benches, so a
      # renamed public item fails here rather than in the test step.
      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked
