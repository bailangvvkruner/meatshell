name: Release

# Build the Windows x64 release. Other platforms are temporarily disabled.
#  - Push to main -> updates the rolling `nightly` pre-release.
#  - Push a tag like `v0.2.3` -> creates/updates the matching formal release.
#  - Run manually (workflow_dispatch) -> uploads a downloadable workflow artifact.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency security audit
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Cargo.lock with RustSec
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0194,RUSTSEC-2026-0195

  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          LOCK_VERSION="$(awk '
            $0 == "name = \"meatshell\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.lock meatshell version ${LOCK_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: [check-version, security-audit]
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: meatshell.exe
          # Temporarily disabled: Linux x64, Linux ARM64, macOS ARM64 and macOS x64.
          # Restore their matrix entries from git history when needed.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
      # Build-time only — no GPU/display required to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@35a842e360814583e976785eeda0bd0655cb8e83 # 1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify bundled ANGLE runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-angle.ps1

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          EXPECTED="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "meatshell ${EXPECTED}"

      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/meatshell AppDir/usr/bin/meatshell
          install -Dm644 assets/meatshell.desktop          AppDir/usr/share/applications/meatshell.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/meatshell.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv meatshell*.AppImage "meatshell-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=meatshell-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERSION="nightly"
          else
            VERSION="${GITHUB_REF_NAME:-dev}"
          fi
          VERSION="${VERSION//\//-}"
          STAGE="meatshell-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="meatshell.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/meatshell" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"

            # Generate .icns from the 512×512 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p meatshell.iconset
            sips -z 16  16  "assets/icon@512.png" --out meatshell.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out meatshell.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out meatshell.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out meatshell.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out meatshell.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out meatshell.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out meatshell.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out meatshell.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out meatshell.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns meatshell.iconset -o "$CONTENTS/Resources/meatshell.icns"

            # Substitute __VERSION__ placeholder (strip leading 'v' from tag)
            VERSION_NUM="${VERSION#v}"
            sed "s/__VERSION__/${VERSION_NUM}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp vendor/angle/windows-x86_64/libEGL.dll vendor/angle/windows-x86_64/libGLESv2.dll "$STAGE/"
            cp vendor/angle/windows-x86_64/LICENSE.txt "$STAGE/ANGLE_LICENSE.txt"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            # Ship the desktop entry + installer + icon so the dock shows the icon.
            cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort: if the WiX/cargo-wix tooling hiccups it must not block the
      # .zip release, hence continue-on-error.
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64'
        continue-on-error: true
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $VERSION = "nightly"
          } else {
            $VERSION = "$env:GITHUB_REF_NAME"
            if (-not $VERSION) { $VERSION = "dev" }
          }
          $VERSION = $VERSION -replace '[\\/]', '-'
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "meatshell-$VERSION-windows-x86_64.msi"
          echo "MSI=meatshell-$VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64-msi
          path: ${{ env.MSI }}

      - name: Move rolling nightly tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -eu
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Publish rolling Windows x64 nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: nightly
          name: Windows x64 nightly
          prerelease: true
          make_latest: false
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach MSI to nightly release
        if: github.ref == 'refs/heads/main' && env.MSI != ''
        continue-on-error: true
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: ${{ env.MSI }}
          fail_on_unmatched_files: false

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach AppImage to GitHub Release
        if: matrix.name == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.APPIMAGE }}
          fail_on_unmatched_files: true

      - name: Attach MSI to GitHub Release
        if: matrix.name == 'windows-x86_64' && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.MSI }}
          fail_on_unmatched_files: false

  build-linux-aarch64-glibc228:
    name: linux-aarch64-glibc228
    # Temporarily disabled. Set ENABLE_NON_WINDOWS_RELEASES=true to restore it.
    if: ${{ vars.ENABLE_NON_WINDOWS_RELEASES == 'true' }}
    needs: [check-version, security-audit]
    permissions:
      contents: write
    runs-on: ubuntu-22.04-arm
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: aarch64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --locked --release --target aarch64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | head -n 1
          file target/aarch64-unknown-linux-gnu/release/meatshell
          objdump -T target/aarch64-unknown-linux-gnu/release/meatshell \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          STAGE="meatshell-${VERSION}-linux-aarch64-glibc228"

          mkdir "$STAGE"
          cp "target/aarch64-unknown-linux-gnu/release/meatshell" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-aarch64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  build-linux-x86_64-glibc228:
    name: linux-x86_64-glibc228
    # Temporarily disabled. Set ENABLE_NON_WINDOWS_RELEASES=true to restore it.
    if: ${{ vars.ENABLE_NON_WINDOWS_RELEASES == 'true' }}
    needs: [check-version, security-audit]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.97.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: x86_64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | head -n 1
          file target/x86_64-unknown-linux-gnu/release/meatshell
          objdump -T target/x86_64-unknown-linux-gnu/release/meatshell \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          STAGE="meatshell-${VERSION}-linux-x86_64-glibc228"

          mkdir "$STAGE"
          cp "target/x86_64-unknown-linux-gnu/release/meatshell" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/meatshell.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
